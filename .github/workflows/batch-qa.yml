name: Batch browser verification
on:
  push:
    branches: [batch/2026-10-27]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run prepare:pwa && npm run check
      - run: npm run api:build
      - name: Install cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-save --ignore-scripts playwright@1.62.1
          google-chrome --version
      - name: Play new games with desktop and touch inputs
        env:
          NODE_PATH: ${{ runner.temp }}/browser-qa/node_modules
        run: |
          npm run preview > "$RUNNER_TEMP/preview.log" 2>&1 &
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)" node scripts/run-batch-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-2026-10-27-browser
          path: output/playwright/

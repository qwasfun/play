name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - 'games/*/README.md'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to release (empty uses current main)
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pages: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run api:build
      - name: Record the tested source version
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.value }}
        run: |
          node --input-type=module -e "import{writeFileSync}from'node:fs';writeFileSync('dist/release.json',JSON.stringify({sha:process.env.RELEASE_SHA}));"
          npm run prepare:pwa
          npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Keep a verified rollback copy
        uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: dist/
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Check release hold and previous successful version
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs prepare
      - name: Verify deployment credentials
        if: steps.state.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Cloudflare 授权：请配置仓库 Secret CLOUDFLARE_API_TOKEN，允许部署当前 Worker 及读取绑定的 D1；无需数据库迁移权限。'
            exit 1
          fi
      - name: Deploy backward-compatible game rules before the website
        if: steps.state.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node node_modules/wrangler/bin/wrangler.js deploy --config worker/wrangler.jsonc
      - name: Verify every game is supported by the backend
        if: steps.state.outputs.skip == 'false'
        run: node scripts/release-smoke.mjs backend
      - name: Deploy the tested website artifact
        if: steps.state.outputs.skip == 'false'
        id: pages
        uses: actions/deploy-pages@v4
      - name: Verify the published version and game routes
        if: steps.state.outputs.skip == 'false'
        run: node scripts/release-smoke.mjs frontend
      - name: Mark the successful source and rollback version
        if: steps.state.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs success
      - name: Pause further integration after a failed release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs hold
      - name: Download the previous verified website
        if: failure() && steps.pages.outcome != 'skipped' && steps.state.outputs.previous_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.state.outputs.previous_artifact }}
          run-id: ${{ steps.state.outputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: output/rollback
      - name: Unpack the old workflow's Pages archive when bootstrapping
        if: failure() && steps.pages.outcome != 'skipped' && steps.state.outputs.previous_artifact == 'github-pages'
        run: |
          mkdir -p output/rollback-site
          tar -xf output/rollback/artifact.tar -C output/rollback-site
      - name: Prepare the previous website for rollback
        if: failure() && steps.pages.outcome != 'skipped' && steps.state.outputs.previous_run_id != ''
        uses: actions/upload-pages-artifact@v4
        with:
          name: rollback-pages
          path: ${{ steps.state.outputs.previous_artifact == 'github-pages' && 'output/rollback-site' || 'output/rollback' }}
      - name: Restore the previous verified website
        if: failure() && steps.pages.outcome != 'skipped' && steps.state.outputs.previous_run_id != ''
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages
      - name: Verify the restored website version
        if: failure() && steps.pages.outcome != 'skipped' && steps.state.outputs.previous_run_id != ''
        env:
          PREVIOUS_SHA: ${{ steps.state.outputs.previous_sha }}
        run: |
          if [ '${{ steps.state.outputs.previous_artifact }}' = 'release-site' ]; then
            RELEASE_SHA="$PREVIOUS_SHA" node scripts/release-smoke.mjs frontend
          else
            node scripts/release-smoke.mjs backend
          fi
  build-failure:
    needs: build
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Pause integration when the release build fails
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: node scripts/release-state.mjs hold
